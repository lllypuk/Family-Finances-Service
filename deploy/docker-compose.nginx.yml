version: '3.8'

# Образ собирается из исходников: публичного образа в GHCR нет (D-02).
# `BUILD_CONTEXT` — путь к корню репозитория относительно project directory
# (каталог первого `-f`). По умолчанию `..`, то есть файл запускается на месте,
# из `deploy/`. `install.sh` кладёт compose в `/opt/family-budget`, клонирует
# исходники в `/opt/family-budget/src` и выставляет `BUILD_CONTEXT=./src`.
#
# ВАЖНО: каталоги bind-mount'ов нужно создать ДО первого `up` и отдать 1000:1000
# (docker/Dockerfile: `USER 1000:1000`). Недостающие каталоги Docker создаёт от
# root, и тогда SQLite не сможет создать БД:
#   mkdir -p data backups logs && sudo chown -R 1000:1000 data backups logs

services:
  app:
    build:
      context: ${BUILD_CONTEXT:-..}
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: family-budget-app
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - DATABASE_PATH=/data/budget.db
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required - generate one with `openssl rand -base64 32`}
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET is required - generate one with `openssl rand -base64 32`}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./logs:/logs
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=50M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      # `--spider` шлёт HEAD, а зарегистрирован только GET /health — HEAD уходит
      # в редирект на /login и healthcheck падает. Поэтому обычный GET в /dev/null.
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: family-budget-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - internal
      - external
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:latest
    container_name: family-budget-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    security_opt:
      - no-new-privileges:true
    networks:
      - external

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
