# Оверлей для машины, где 80 и 443 уже заняты чужим TLS-терминатором.
#
# Так развёрнут mini-server: там стоит общий Caddy лендинга shatrov.tech, и
# второй Caddy туда не встанет — конфликт портов. Поэтому свой не поднимается
# вовсе, а общий ходит в приложение по общей докеровской сети `edge`.
#
# Подключается через COMPOSE_FILE в .env, не флагом -f: release.sh зовёт
# `docker compose` без файлов, а раскладка — свойство машины, а не выпуска.
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxied.yml
#
# Что здесь важно:
#
#   - Caddy не удаляется, а уезжает в профиль: удалить сервис оверлеем нечем,
#     а профиль, который никто не включает, оставляет его невзведённым. Своя
#     раскладка (compose поднимает TLS сам) остаётся умолчанием.
#
#   - Заголовки из caddy/Caddyfile здесь не читаются вовсе. HSTS и CSP
#     переезжают в общий Caddy вместе с сайтом — образец блока в README.
#
#   - TRUSTED_PROXIES переопределяется на подсеть `edge`: X-Forwarded-For
#     приходит от чужого терминатора, а не из сети internal, и с адресом из
#     базового файла IPExtractor не признал бы его доверенным. Тогда корзина
#     per-IP в лимитере логина считала бы обоих пользователей одним клиентом.
#
#   - Порт наружу по-прежнему не публикуется: в `edge` до приложения
#     дотягивается только терминатор.
#
#   - Сеть `edge` заводится на машине руками (`docker network create edge`) и
#     объявлена внешней: она общая с чужим стеком, и `docker compose down`
#     этого проекта не должен её уносить.
services:
  caddy:
    profiles:
      - own-tls

  app:
    environment:
      TRUSTED_PROXIES: ${FFS_EDGE_SUBNET:?нужна подсеть сети edge, см. .env.example}
    networks:
      # Сеть проекта перечисляется явно: как только у сервиса появляется свой
      # список сетей, неявное подключение к остальным пропадает.
      internal: {}
      edge:
        aliases:
          # Имя, по которому терминатор находит этот инстанс в общей сети.
          - ffs

networks:
  edge:
    external: true
