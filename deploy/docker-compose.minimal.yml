version: '3.8'

# Minimal configuration for testing without SSL
# Use this for local development or behind an existing reverse proxy
#
# Образ собирается из исходников: публичного образа в GHCR нет (D-02).
# `BUILD_CONTEXT` — путь к корню репозитория относительно project directory
# (каталог первого `-f`). По умолчанию `..`, то есть файл запускается на месте,
# из `deploy/`. `install.sh` кладёт compose в `/opt/family-budget`, клонирует
# исходники в `/opt/family-budget/src` и выставляет `BUILD_CONTEXT=./src`.

services:
  app:
    build:
      context: ${BUILD_CONTEXT:-..}
      dockerfile: docker/Dockerfile
    container_name: family-budget-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - DATABASE_PATH=/data/budget.db
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required - generate one with `openssl rand -base64 32`}
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET is required - generate one with `openssl rand -base64 32`}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./logs:/logs
    healthcheck:
      # `--spider` шлёт HEAD, а зарегистрирован только GET /health — HEAD уходит
      # в редирект на /login и healthcheck падает. Поэтому обычный GET в /dev/null.
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Usage:
#   cp .env.production.example .env   # затем заполнить SESSION_SECRET и CSRF_SECRET
#   docker compose -f docker-compose.minimal.yml up -d --build
#
# Без заданных SESSION_SECRET и CSRF_SECRET compose откажется стартовать —
# так задумано (S-04): «безопасных» значений по умолчанию для секретов не бывает.
#
# Access at:
#   http://localhost:8080
#
# Stop with:
#   docker compose -f docker-compose.minimal.yml down
