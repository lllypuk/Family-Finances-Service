version: "3.8"

# ВАЖНО: этот файл рассчитан на project directory = корень репозитория.
# По умолчанию compose v2 берёт её из каталога первого `-f` (то есть `docker/`),
# и тогда `.env` ищется в `docker/.env`, а все относительные пути (build context,
# `DATA_DIR`) резолвятся от `docker/`. Поэтому запускать нужно так:
#
#   docker compose --project-directory . -f docker/docker-compose.yml up -d
#
# Именно это делают цели `make docker-up` / `docker-up-d` / `docker-down`.
# `.env` при этом лежит в корне репозитория — как и учит README.

services:
  # Family Budget Service - единый контейнер с SQLite
  family-budget:
    build:
      # Относительно project directory (корень репозитория, см. комментарий выше).
      context: .
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: family-budget-service
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Server Configuration.
      # Внутри контейнера порт всегда 8080 (его же ждут `ports` и healthcheck);
      # `SERVER_PORT` управляет только портом на хосте — как в deploy/*.yml.
      SERVER_PORT: 8080
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}

      # Database Configuration (SQLite)
      DATABASE_PATH: ${DATABASE_PATH:-/data/budget.db}
      # Каталог бэкапов вынесен из тома с БД: `VACUUM INTO` пишет копию рядом
      # с оригиналом только если BACKUP_DIR пуст.
      BACKUP_DIR: ${BACKUP_DIR:-/backups}

      # Application Configuration
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # CIDR через запятую, чьи X-Forwarded-For определяют IP клиента для лимитера логина.
      # Пусто — доверять только RemoteAddr (без обратного прокси).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

    volumes:
      # Persistent volume for SQLite database
      - budget_data:/data
      - budget_backups:/backups
    networks:
      - family-budget-network
    healthcheck:
      # GET /health: HEAD не зарегистрирован, поэтому не `--spider`.
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  budget_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/data
  # Каталог должен существовать до `up`: bind-том его не создаёт.
  budget_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/backups

networks:
  family-budget-network:
    driver: bridge
