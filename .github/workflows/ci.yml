name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.26.7"

# Дефолт для всех джоб; write-скоупы выдаются точечно на уровне джобы.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: make deps

      - name: Verify dependencies
        run: go mod verify

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m --verbose

      - name: Run security vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Run tests
        run: make test-coverage

      - name: Check test coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total test coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE" | cut -d. -f1) < 50 )); then
            echo "Warning: Test coverage is below 50%"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build application
        run: make build

      - name: Verify build output
        run: |
          if [ ! -f "build/family-budget-service" ]; then
            echo "Build failed: binary not found"
            exit 1
          fi
          ls -la build/
          file build/family-budget-service

      # Ловит D-01: compose-файл, который не стартует из-за опечатки или
      # незаданного `${VAR:?…}`, должен падать здесь, а не на сервере пользователя.
      - name: Validate docker-compose files
        run: make compose-config

      - name: Test Docker build
        run: |
          docker build -f docker/Dockerfile --build-arg VERSION=test -t family-budget-service:test .
          docker images family-budget-service:test

      # Раньше шаг не мог упасть: `docker ps -a` возвращает 0 и для контейнера,
      # который сразу вышел с ошибкой. Проверяем ответ /health и версию сборки.
      - name: Test Docker container runs
        run: |
          docker run -d --name test-container -p 8080:8080 \
            -e ENVIRONMENT=production \
            -e SESSION_SECRET="$(openssl rand -base64 32)" \
            -e CSRF_SECRET="$(openssl rand -base64 32)" \
            family-budget-service:test
          for _ in $(seq 1 20); do
            body=$(curl -fsS localhost:8080/health) && break
            sleep 1
          done
          docker logs test-container
          echo "$body"
          echo "$body" | grep -q '"version":"test"'

      - name: Remove test container
        if: always()
        run: docker rm -f test-container || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: family-budget-service-${{ github.sha }}
          path: build/
          retention-days: 7
