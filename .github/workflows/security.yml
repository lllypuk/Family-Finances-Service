name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scans on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

env:
  GO_VERSION: "1.26.7"

# Дефолт для всех джоб; write-скоупы выдаются точечно на уровне джобы.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build application
        run: |
          make deps
          make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{matrix.language}}"

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Run govulncheck and Filter Results
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

          # Run govulncheck, capturing its exit code without failing the step.
          # Exit code 0 = no vulns, 3 = vulns found, other = error.
          exit_code=0
          govulncheck -json ./... > govulncheck-report.json || exit_code=$?

          echo "--- govulncheck report ---"
          cat govulncheck-report.json
          echo "--------------------------"

          if [ $exit_code -eq 0 ]; then
            echo "Success: No vulnerabilities found."
            exit 0
          fi

          # If exit code is not 3, it's an unexpected error.
          if [ $exit_code -ne 3 ]; then
            echo "Error: govulncheck failed with unexpected exit code $exit_code."
            exit $exit_code
          fi

          # Exit code is 3, so vulns were found. Check if they are all ignorable.
          # Use jq to count vulnerabilities that are NOT the one we want to ignore.
          # The `-s` flag reads the JSON stream into a single array.
          UNIGNORED_COUNT=$(jq -s 'map(select(.osv.id != "GO-2025-3829" and .osv.id != "GO-2026-4337")) | length' govulncheck-report.json)

          if [ "$UNIGNORED_COUNT" -eq 0 ]; then
            echo "Success: Only ignored vulnerabilities were found."
            exit 0
          else
            echo "Error: Found $UNIGNORED_COUNT unignored vulnerabilities."
            jq -s 'map(select(.osv.id != "GO-2025-3829" and .osv.id != "GO-2026-4337"))' govulncheck-report.json
            exit 1
          fi

      - name: Upload govulncheck report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: govulncheck-report
          path: govulncheck-report.json
          retention-days: 30

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          # base/head намеренно не заданы: при push в main они оба резолвились
          # в один коммит и экшен падал с "BASE and HEAD commits are the same".
          # Без них диапазон выбирается по типу события: push →
          # event.before..event.after, pull_request → base.sha..head.sha,
          # schedule → полное сканирование истории.
          extra_args: --debug --only-verified

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Для шага "Upload SARIF file"
      security-events: write

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep \
            --config=auto \
            --sarif \
            --output=semgrep-report.sarif \
            --severity=ERROR \
            --severity=WARNING \
            .

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: semgrep-report.sarif

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for uploading SARIF results to Code Scanning
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install OSV Scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: Create OSV Scanner ignore config
        run: |
          cat <<EOF > .osv-scanner.toml
          [[IgnoredVulns]]
          id = "GO-2025-3829"
          reason = "Test-only vulnerability in a transitive dependency (docker/docker) with no available fix. Not relevant to production."
          
          [[IgnoredVulns]]
          id = "GO-2026-4337"
          reason = "Fixed by upgrading to Go 1.26.0. This vulnerability is resolved by the Go version update."

          [[IgnoredVulns]]
          id = "GO-2026-5932"
          reason = "golang.org/x/crypto/openpgp is unmaintained and has no fix version. This project imports only golang.org/x/crypto/bcrypt; govulncheck confirms the openpgp code is never called."
          EOF

      - name: Run OSV Scanner
        run: |
          # Add the Go bin directory to the PATH to ensure osv-scanner is found
          export PATH=$(go env GOPATH)/bin:$PATH
          osv-scanner --config=.osv-scanner.toml --format=sarif --output=osv-results.sarif ./

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: osv-results.sarif

# OSSF Scorecard живёт в отдельном scorecard.yml: с publish_results: true
# scorecard-action отвергает результаты любого workflow, где объявлен глобальный
# env или defaults — а здесь есть env.GO_VERSION.
# https://github.com/ossf/scorecard-action#workflow-restrictions
