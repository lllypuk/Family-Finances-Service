name: Docker Build

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker tag to build"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Дефолт для всех джоб; write-скоупы выдаются точечно на уровне джобы.
permissions:
  contents: read

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Для шага "Upload Trivy scan results to GitHub Security tab"
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Ссылка на образ берётся из metadata-action: env.IMAGE_NAME = github.repository
      # содержит заглавные буквы (Family-Finances-Service), а docker отвергает такой
      # reference — «repository name must be lowercase».
      - name: Resolve image reference
        id: image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          META_VERSION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
        run: |
          printf 'ref=%s\n' "$(printf '%s\n' "$TAGS" | head -n1)" >> "$GITHUB_OUTPUT"
          # /health должен отдавать ту же строку, что даёт `git describe` в Makefile и
          # deploy-скриптах, — с ведущим v; metadata-action его у semver-тега срезает.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            printf 'version=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'version=%s\n' "$META_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Dockerfile лежит в docker/, а не в корне: без file: сборка падает
          # на первом же теге v*.*.* с "failed to read dockerfile".
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      # Сборка мультиплатформенная и push-only, в локальный демон образ не попадает:
      # `docker image inspect` тут всегда падал с "No such image". Размер считаем по
      # манифесту linux/amd64 — это сжатые слои, порог соответственно мягче.
      - name: Check image size
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE_REF" --raw |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          image_size=$(docker buildx imagetools inspect "${IMAGE_REF%:*}@$digest" --raw |
            jq '[.config.size] + [.layers[].size] | add')
          echo "Compressed image size: $((image_size / 1024 / 1024)) MB"

          if [ "$image_size" -gt 52428800 ]; then
            echo "Error: Docker image is too large ($((image_size / 1024 / 1024)) MB > 50 MB)"
            exit 1
          fi

      # `docker run --rm <image> -health-check` запускал только клиент healthcheck в пустом
      # контейнере: сервера внутри нет, connection refused, exit 1. Поднимаем контейнер и
      # проверяем сам /health, а бинарь healthcheck (его же зовёт HEALTHCHECK) — через exec.
      - name: Test Docker image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker run -d --name smoke-container -p 8080:8080 \
            "$IMAGE_REF"
          for _ in $(seq 1 20); do
            body=$(curl -fsS localhost:8080/health) && break
            sleep 1
          done
          docker logs smoke-container
          echo "$body"
          echo "$body" | grep -q '"version"'
          docker exec smoke-container /app/family-budget-service -health-check

      - name: Remove smoke container
        if: always()
        run: docker rm -f smoke-container || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Для шага "Upload Trivy scan results"
      security-events: write
    needs: build
    if: always()

    steps:
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-repo-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: "trivy-repo-results.sarif"
